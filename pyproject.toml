[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "clem2k-ui"
version = "0.1.0"
description = "clem2k design system: tokens, CSS, React components, Qt/Rich/Textual themes and pixel icons."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "clem2k" }]
dependencies = []

[project.optional-dependencies]
fastapi = ["starlette", "jinja2"]
flask = ["flask"]
qt = ["PySide6"]
rich = ["rich"]
textual = ["textual>=0.86"]

[tool.hatch.build.targets.wheel]
packages = ["python/clem2k_ui"]

[tool.hatch.build.targets.wheel.force-include]
"dist" = "clem2k_ui/static"
"assets/logo" = "clem2k_ui/static/logo"

[tool.hatch.build.targets.sdist]
include = ["python", "dist", "assets", "tokens", "README.md"]
